<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><script src="capture.js" defer></script><script src="popup.js" defer></script><body><h2>到外部平台找球友需求</h2><p>先在工作台开启自动采集，再从已登录的平台搜索结果页启动。每轮最多处理5个已展示的原帖链接，采集后自动去重入库、排队准备回复。</p><label>工作台地址<select id="destination"><option value="https://qiuchen.yinxingpingpang.com/api/match-center/growth/">俱乐部获客工作台</option><option value="http://127.0.0.1:8796/api/match-center/growth/">本机开发工作台</option></select></label><button id="continuousStart">启动本平台连续采集</button><button id="continuousStop">停止连续采集</button><p id="continuousState" role="status"></p><hr><button id="capture">读取当前已展示评论</button><button id="post">读取当前作品求助（抖音／小红书）</button><button id="selection">读取我选中的一条原文</button><p id="result" role="status"></p><pre id="samples"></pre><button id="send" disabled>送到工作台核对 →</button><p>本功能运行在本机浏览器，需要保持浏览器和工作台登录。换平台需在对应页重新启动。每轮结束等8分钟；连续3轮无有效新增则暂停。登录、验证码、原帖打开失败时停止，不绕过限制。不读取私信、密码或Cookie，不发送评论／私信。视频号暂用手机搜索后复制公开原文。</p></body></html>
