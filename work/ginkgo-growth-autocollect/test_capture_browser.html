 async function test(name,html,fn){let f;try{f=await fixture(html);await fn(f.contentDocument);results.push({name,passed:true})}catch(e){results.push({name,passed:false,error:e.message})}finally{if(f)f.remove()}const li=document.createElement('li');li.textContent=name+'：'+(results.at(-1).passed?'通过':'失败 '+results.at(-1).error);li.className=results.at(-1).passed?'ok':'bad';document.querySelector('#results').append(li)}

 await test('弹窗评论布局','<div class="video_7701372394577607067" data-e2e="feed-active-video"><div data-e2e="video-desc">当前作品</div>'+row(ask,'sU2yAQQU')+'</div>',doc=>{check(read(doc).items.length===1,'弹窗评论漏收')});

 await test('私信页不会读取','<h1>成都想找乒乓球教练</h1>',doc=>{const b=GinkgoCapture.inspectPublicPage({document:doc,source_url:'https://www.xiaohongshu.com/chat'});check(!!b.blocked,'读取了私信页')});
 await test('抖音搜索标题先回执再触发真实点击','<div class="BjLsdJMi">成都想找乒乓球教练</div>',async doc=>{let clicks=0;doc.querySelector('.BjLsdJMi').onclick=()=>clicks++;const r=GinkgoCapture.openSearchTitle('成都想找乒乓球教练',{document:doc,source_url:'https://www.douyin.com/search/成都乒乓球'});check(r.scheduled&&clicks===0,'点击早于回执');await new Promise(resolve=>setTimeout(resolve,250));check(clicks===1,'没有准确点击原文标题')});

 const searchUrl='https://www.douyin.com/search/成都乒乓球';
 const filterHtml='<span class="P1BREWal">筛选</span><div>排序依据<span class="eXMmo3JR">综合排序</span><span class="eXMmo3JR sDNqBVWH">最新发布</span><span class="eXMmo3JR">最多点赞</span></div>';
 await test('已选最新发布无需重复点击筛选',filterHtml,doc=>{let clicks=0;doc.querySelectorAll('span').forEach(n=>n.onclick=()=>clicks++);const r=GinkgoCapture.ensureRecentSearch({document:doc,source_url:searchUrl});check(r.ready&&clicks===0,'重复点击或误判排序');check(GinkgoCapture.inspectPublicPage({document:doc,source_url:searchUrl}).search_sort==='latest','未保留公开选中标记')});
 await test('返回默认排序只点击最新发布选项',filterHtml.replace('eXMmo3JR sDNqBVWH','eXMmo3JR'),doc=>{let latest=0,other=0;doc.querySelectorAll('span').forEach(n=>n.onclick=()=>{if(n.textContent==='最新发布')latest++;else other++});const r=GinkgoCapture.ensureRecentSearch({document:doc,source_url:searchUrl});check(r.pending&&r.action==='select_latest'&&latest===1&&other===0,'点击了错误筛选项')});
 await test('筛选收起先打开普通筛选控件','<span class="P1BREWal">筛选</span>',doc=>{let clicks=0;doc.querySelector('span').onclick=()=>clicks++;const r=GinkgoCapture.ensureRecentSearch({document:doc,source_url:searchUrl});check(r.pending&&r.action==='open_filters'&&clicks===1,'未打开已核对筛选入口')});
 await test('隐藏筛选不冒充已应用排序',filterHtml.replace('<div>排序依据','<div style="display:none">排序依据'),doc=>{check(GinkgoCapture.searchSortState(doc,doc.defaultView)==='unknown','读取隐藏选项为已选状态')});
 await test('筛选结构歧义或改版停止而非猜测',filterHtml+'<span class="eXMmo3JR">最新发布</span>',doc=>{let failed=false;try{GinkgoCapture.ensureRecentSearch({document:doc,source_url:searchUrl})}catch{failed=true}check(failed,'歧义布局仍继续点击')});
 await test('其它平台和作品弹窗禁止触发排序',filterHtml,doc=>{for(const url of ['https://evil.invalid/search/成都','https://www.douyin.com/search/成都?modal_id=7679679918087250107','https://www.douyin.com/video/7679679918087250107']){let failed=false;try{GinkgoCapture.ensureRecentSearch({document:doc,source_url:url})}catch{failed=true}check(failed,'越界执行排序')}});
 const ksSource='https://www.kuaishou.com/short-video/3x7example12';

 const ksPanel=(t,link=ksSource)=>'<div class="video-sidebar-layout"><a href="'+link+'">公开原帖</a>'+ksRow(t)+'</div>';
 await test('快手预加载多个面板时不混合相邻评论',ksPanel(ask)+ksPanel('成都请问哪里找乒乓球搭子'),doc=>{let failed=false;try{read(doc,'visible',ksSource)}catch{failed=true}check(failed,'混合读取了多个作品面板')});
 await test('快手唯一公开原帖只采其面板内评论',ksPanel(ask)+ksRow('成都请问哪里找乒乓球搭子'),doc=>{const r=read(doc,'visible',ksSource);check(r.items.length===1&&r.items[0].excerpt===ask,'读入当前面板外评论')});
 await test('快手连播换作品后不能继承旧原帖链接',ksPanel(ask,'https://www.kuaishou.com/short-video/another12'),doc=>{let failed=false;try{read(doc,'visible',ksSource)}catch{failed=true}check(failed,'未核对连播作品与地址身份')});
 await test('快手没有公开链接的搜索卡片明确停止','<div class="photo-card">成都找乒乓球搭子</div>',doc=>{const r=GinkgoCapture.inspectPublicPage({document:doc,source_url:'https://www.kuaishou.com/search/成都乒乓球'});check(!!r.blocked&&/链接/.test(r.blocked),'无来源卡片仍反复扫描')});

 await test('新版筛选入口经实际结构核对可打开','<div tabindex="0"><span class="QfeM8ow3">筛选</span></div>',doc=>{let clicks=0;doc.querySelector('span').onclick=()=>clicks++;check(GinkgoCapture.ensureRecentSearch({document:doc,source_url:searchUrl}).action==='open_filters'&&clicks===1,'新入口不能打开')});
 await test('身份一致的已加载弹层直接读取原文与自身时间','<div class="video_7701372394577607067" data-e2e="feed-active-video"><div data-e2e="video-info"><span class="time">· 1天前</span><div data-e2e="video-desc">成华区有人一起练单球吗，本人萌新#乒乓球搭子 #成都成华区</div></div>'+row(ask)+'</div>',doc=>{const r=GinkgoCapture.inspectPublicPage({document:doc,source_url:source});check(r.modal_identity_verified&&!r.needs_canonical,'强制跳转独立页');check(r.items[0].source_kind==='post'&&r.items[0].posted_text==='1天前','没有保留原帖相对时间');check(r.items.length===2,'未同时读取原文与评论')});

 const noteUrl='https://www.douyin.com/note/7702708741762243570';
 const noteHtml=body=>'<main data-e2e="note-detail"><div class="daVLa2m7"><div class="RMlWQIcN">'+body+'</div><span>发布时间：2026-10-31 14:03:54</span></div><div data-e2e="feed-active-video"><h3>成都乒乓球教练推荐广告</h3>'+row(ask)+'</div></main>';

 document.title=results.every(x=>x.passed)?'PASS '+results.length+' 采集检查':'FAIL 采集检查';
 const out=document.createElement('pre');out.id='report';out.textContent=JSON.stringify({passed:results.every(x=>x.passed),tests:results.length,results,live_messages:0},null,2);document.body.append(out);
})();
